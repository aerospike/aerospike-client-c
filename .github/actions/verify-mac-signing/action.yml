name: Verify macOS Package Signing
description: >
  Verifies that every loose .pkg in signed-dir is Apple-signed and notarized,
  and that every .pkg embedded in *_mac_*.tgz is likewise signed (catches
  stale unsigned copies left by pkg/package). Asserts signed count ==
  expected-count, then runs pkgutil + spctl and fails loudly on any mismatch.

inputs:
  signed-dir:
    description: Directory containing the signed .pkg files
    required: false
    default: signed-artifacts
  expected-count:
    description: Expected .pkg count — must equal the unsigned build count
    required: true

runs:
  using: composite
  steps:
    - name: Verify all .pkg files are signed and notarized
      shell: bash
      run: |
        bash "${{ github.action_path }}/verify.sh" \
          "${{ inputs.signed-dir }}" \
          "${{ inputs.expected-count }}"
