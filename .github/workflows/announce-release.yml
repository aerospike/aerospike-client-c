name: Announce Release
run-name: Announce release — aerospike-client-c${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && ' (dry-run)' || '' }}

# Run this workflow from master after stage has been merged to master.
#
# Resolves the release target as merge-base(master, stage), tags that commit with the
# version from version.c, reuses API docs from the stage build (or build-run-id), and
# drafts a GitHub release. Manual runs default to dry-run (no tag push, no GitHub draft,
# release notes preview in job logs only). Real runs check for an existing GitHub release
# before tagging; push-tag is idempotent when the tag already points at the release target.

permissions:
  actions: read   # download api-docs artifact from an earlier workflow run
  contents: write # push release tag

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release notes in logs only — no tag push, no GitHub draft release
        required: false
        type: boolean
        default: true
      build-run-id:
        description: >
          Optional C Client Build & Release run ID (e.g. 27700135842). Use when the release
          build is not at the merge-base commit — otherwise api-docs lookup fails.
        required: false
        type: string
        default: ''

env:
  IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry-run && 'true' || 'false') || 'false' }}
  BASE_REF_BRANCH: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref_name }}
  HEAD_REF_BRANCH: ${{ github.event_name == 'workflow_dispatch' && 'stage' || github.ref_name }}
  BUILD_RUN_ID: ${{ inputs.build-run-id || '' }}
  
defaults:
  run:
    shell: bash

jobs:
  resolve-version:
    name: resolve version
    runs-on: ubuntu-24.04
    outputs:
      version:    ${{ steps.ver.outputs.version }}
      target-sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout ${{ env.BASE_REF_BRANCH }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.BASE_REF_BRANCH }}
          fetch-depth: 0   # required for git merge-base

      - name: Resolve release target (merge-base of ${{ env.BASE_REF_BRANCH }} and ${{ env.HEAD_REF_BRANCH }})
        id: target
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${HEAD_REF_BRANCH}:refs/remotes/origin/${HEAD_REF_BRANCH}"
          target=$(git merge-base HEAD "origin/${HEAD_REF_BRANCH}")
          echo "Release target SHA: $target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout release target
        run: git checkout "${{ steps.target.outputs.sha }}"

      # Tag and release name use the committed version at merge-base (version.c),
      - name: Read version from release target
        id: ver
        run: |
          set -euo pipefail
          VERSION_REL="src/main/aerospike/version.c"
          version=$(sed -nE 's/.*aerospike_client_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$VERSION_REL")
          if [ -z "$version" ]; then
            echo "::error::Could not read aerospike_client_version from $VERSION_REL at ${{ steps.target.outputs.sha }}"
            exit 1
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check-existing-release:
    name: check existing release
    needs: resolve-version
    runs-on: ubuntu-24.04
    outputs:
      skip-draft:   ${{ steps.guard.outputs.skip-draft }}
      existing-url: ${{ steps.guard.outputs.existing-url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Check for existing release
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:  ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "skip-draft=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" \
            --jq '.html_url // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "::warning::Release ${VERSION} already exists (${existing}). Skipping draft creation — edit release notes manually."
            echo "skip-draft=true" >> "$GITHUB_OUTPUT"
            echo "existing-url=${existing}" >> "$GITHUB_OUTPUT"
          else
            echo "skip-draft=false" >> "$GITHUB_OUTPUT"
          fi

  api-doc:
    name: api doc
    needs: resolve-version
    runs-on: ubuntu-24.04
    outputs:
      archive:              ${{ steps.publish.outputs.archive }}
      html-count:           ${{ steps.publish.outputs.html-count }}
      api-doc-version:      ${{ steps.locate.outputs.api-doc-version }}
      source-run-id:        ${{ steps.locate.outputs.run-id }}
      source-run-sha:       ${{ steps.locate.outputs.source-run-sha }}
      source-run-url:       ${{ steps.locate.outputs.run-url }}
      source-artifact-url:  ${{ steps.locate.outputs.artifact-url }}
      source-artifact-name: ${{ steps.locate.outputs.artifact-name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      # Resolve api-docs artifact from build-artifacts (C Client Build & Release) or by build-run-id override.
      - name: Locate ${{ env.HEAD_REF_BRANCH }} API docs artifact
        id: locate
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          VERSION:    ${{ needs.resolve-version.outputs.version }}
          TARGET_SHA: ${{ needs.resolve-version.outputs.target-sha }}
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          run_url="${GITHUB_SERVER_URL}/${repo}/actions/runs"
          expected="api-docs-${VERSION}"

          emit() {
            local run_id="$1" name="$2" id="$3" run_sha="$4"
            local run_link="${run_url}/${run_id}"
            local artifact_link="${run_link}/artifacts/${id}"
            local api_doc_version="${name#api-docs-}"

            echo "run-id=$run_id"                  >> "$GITHUB_OUTPUT"
            echo "artifact-name=$name"             >> "$GITHUB_OUTPUT"
            echo "artifact-id=$id"                 >> "$GITHUB_OUTPUT"
            echo "api-doc-version=$api_doc_version" >> "$GITHUB_OUTPUT"
            echo "source-run-sha=$run_sha"         >> "$GITHUB_OUTPUT"
            echo "run-url=$run_link"               >> "$GITHUB_OUTPUT"
            echo "artifact-url=$artifact_link"     >> "$GITHUB_OUTPUT"

            echo "${HEAD_REF_BRANCH} build workflow run: $run_link"
            echo "${HEAD_REF_BRANCH} API docs artifact: $name (version ${api_doc_version})"
            echo "Build run commit: ${run_sha}"
            if [ "$run_sha" != "$TARGET_SHA" ]; then
              echo "::warning::Tag commit (${TARGET_SHA}) and build run commit (${run_sha}) differ"
            fi
            echo "Review artifact: $artifact_link"
          }

          pick_api_docs_from_run() {
            local run_id="$1"
            local run_sha snap picked
            run_sha=$(gh api "/repos/${repo}/actions/runs/${run_id}" --jq '.head_sha')
            snap="${expected}-${TARGET_SHA:0:8}"
            picked=$(gh api "/repos/${repo}/actions/runs/${run_id}/artifacts" \
              | jq --arg expected "$expected" --arg snap "$snap" '
                [.artifacts[] | select(.expired == false and (.name | startswith("api-docs-")))] as $all |
                ($all | map(select(.name == $expected)) | .[0]) //
                ($all | map(select(.name == $snap)) | .[0]) //
                ($all | .[0])')
            [ -n "$picked" ] && [ "$picked" != "null" ] || {
              echo "::error::No api-docs artifact on run ${run_id} for commit ${TARGET_SHA}"
              exit 1
            }
            emit "$run_id" "$(echo "$picked" | jq -r '.name')" "$(echo "$picked" | jq -r '.id')" "$run_sha"
          }

          if [ -n "$BUILD_RUN_ID" ]; then
            echo "Build run override — picking api-docs from run ${BUILD_RUN_ID}"
            pick_api_docs_from_run "$BUILD_RUN_ID"
          else
            echo "Finding successful ${HEAD_REF_BRANCH} build for commit ${TARGET_SHA}"
            run_id=""
            for wf in push-to-stage.yml build-artifacts.yml; do
              run_id=$(gh run list --repo "$repo" --workflow "$wf" --commit "$TARGET_SHA" \
                --status success --json databaseId --limit 1 --jq '.[0].databaseId // empty' 2>/dev/null || true)
              [ -n "$run_id" ] && { echo "Matched ${wf} run ${run_id}"; break; }
            done
            [ -n "$run_id" ] || {
              echo "::error::No successful ${HEAD_REF_BRANCH} build for ${TARGET_SHA}. Run C Client Build & Release first, or set build-run-id."
              exit 1
            }
            pick_api_docs_from_run "$run_id"
          fi

      - name: Download API docs from ${{ env.HEAD_REF_BRANCH }} build
        if: env.IS_DRY_RUN != 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.locate.outputs.run-id }}
          name: ${{ steps.locate.outputs.artifact-name }}

      - name: Validate API docs archive
        id: publish
        if: env.IS_DRY_RUN != 'true'
        run: |
          set -euo pipefail

          downloaded=$(find . -maxdepth 1 -name 'api-docs-*.tgz' -print -quit)
          [ -n "$downloaded" ] || { echo "::error::Downloaded API docs archive not found"; exit 1; }

          html_count=$(tar -tzf "$downloaded" | wc -l | tr -d ' ')
          [ "$html_count" -gt 0 ] || { echo "::error::Downloaded API docs archive is empty"; exit 1; }

          echo "archive=$downloaded" >> "$GITHUB_OUTPUT"
          echo "html-count=$html_count" >> "$GITHUB_OUTPUT"
          echo "Validated ${html_count} entries in $(basename "$downloaded")"

      - name: Upload API docs artifact
        if: env.IS_DRY_RUN != 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: api-docs-${{ needs.resolve-version.outputs.version }}
          path: ${{ steps.publish.outputs.archive }}
          retention-days: 30

      - name: Skip download and upload (dry-run)
        if: env.IS_DRY_RUN == 'true'
        run: echo "[dry-run] Skipping API docs download and upload — use the ${HEAD_REF_BRANCH} build links above to review."

  push-tag:
    name: create and push tag
    needs: [resolve-version, api-doc, check-existing-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout ${{ env.BASE_REF_BRANCH }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.BASE_REF_BRANCH }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create and push release tag
        id: tag
        env:
          VERSION:    ${{ needs.resolve-version.outputs.version }}
          TARGET_SHA: ${{ needs.resolve-version.outputs.target-sha }}
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "[dry-run] Would create annotated tag $VERSION at $TARGET_SHA"
            echo "[dry-run] Would run: git push origin $VERSION"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            tag_sha=$(git rev-parse "refs/tags/${VERSION}^{commit}")
            target_sha=$(git rev-parse "${TARGET_SHA}^{commit}")
            if [ "$tag_sha" = "$target_sha" ]; then
              echo "Tag ${VERSION} already points to ${TARGET_SHA} — skipping tag push"
              exit 0
            fi
            echo "::error::Tag ${VERSION} points to ${tag_sha}, expected release target ${TARGET_SHA}."
            exit 1
          fi

          git tag -a "$VERSION" -m "Release $VERSION" "$TARGET_SHA"
          git push origin "$VERSION"
          echo "Tagged $TARGET_SHA as $VERSION"

  draft-github-release:
    name: draft github release
    needs: [resolve-version, push-tag, check-existing-release]
    if: |
      always() &&
      needs.resolve-version.result == 'success' &&
      needs.push-tag.result == 'success' &&
      (inputs.dry-run == true || needs.check-existing-release.outputs.skip-draft != 'true')
    runs-on: ubuntu-24.04
    outputs:
      prev-tag:    ${{ steps.notes.outputs.prev-tag }}
      release-url: ${{ steps.release.outputs.url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout local actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/generate-release-notes
          sparse-checkout-cone-mode: true

      - name: Checkout release target
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve-version.outputs.target-sha }}
          fetch-depth: 0
          fetch-tags: true
          path: release-target

      - name: Generate release notes
        id: notes
        uses: ./.github/actions/generate-release-notes
        with:
          version:          ${{ needs.resolve-version.outputs.version }}
          target-sha:       ${{ needs.resolve-version.outputs.target-sha }}
          dry-run:          ${{ env.IS_DRY_RUN }}
          repository-path:  release-target

      - name: Create GitHub draft release
        id: release
        if: env.IS_DRY_RUN != 'true'
        uses: step-security/action-gh-release@5f6a6ab53a5a2c000ff3a16fad038291e5b97ce7 # v2.4.2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: Aerospike C Client ${{ needs.resolve-version.outputs.version }}
          body_path: ${{ steps.notes.outputs.release-notes-path }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: summary
    if: always()
    needs: [resolve-version, check-existing-release, api-doc, push-tag, draft-github-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Write release summary
        env:
          VERSION:              ${{ needs.resolve-version.outputs.version }}
          TARGET_SHA:           ${{ needs.resolve-version.outputs.target-sha }}
          RELEASE_URL:          ${{ needs.draft-github-release.outputs.release-url }}
          SKIP_DRAFT:           ${{ needs.check-existing-release.outputs.skip-draft }}
          EXISTING_RELEASE_URL: ${{ needs.check-existing-release.outputs.existing-url }}
          SOURCE_ARTIFACT:      ${{ needs.api-doc.outputs.source-artifact-name }}
          SOURCE_ARTIFACT_URL:  ${{ needs.api-doc.outputs.source-artifact-url }}
          SOURCE_RUN_URL:       ${{ needs.api-doc.outputs.source-run-url }}
          SOURCE_RUN_SHA:       ${{ needs.api-doc.outputs.source-run-sha }}
        run: |
          {
            echo "## Announce Release"
            echo ""
            echo "| Item | Value |"
            echo "| :--- | :--- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Tag commit | \`$TARGET_SHA\` |"
            if [ -n "$RELEASE_URL" ]; then
              echo "| Draft | [Aerospike C Client ${VERSION}](${RELEASE_URL}) |"
            elif [ "$SKIP_DRAFT" = "true" ] && [ -n "$EXISTING_RELEASE_URL" ]; then
              echo "| Draft | skipped — [existing release](${EXISTING_RELEASE_URL}) |"
            elif [ "$IS_DRY_RUN" = "true" ]; then
              echo "| Draft | dry-run — not on GitHub (see draft github release job logs) |"
            else
              echo "| Draft | not found for tag \`${VERSION}\` |"
            fi
            if [ -n "$SOURCE_ARTIFACT" ] || [ -n "$SOURCE_RUN_URL" ]; then
              echo "## API docs"
              echo ""
              echo "| Item | Value |"
              echo "| :--- | :--- |"
              if [ -n "$SOURCE_ARTIFACT" ]; then
                echo "| Artifact | [\`${SOURCE_ARTIFACT}\`](${SOURCE_ARTIFACT_URL}) |"
              fi
              if [ -n "$SOURCE_RUN_URL" ]; then
                echo "| Build run | [workflow run](${SOURCE_RUN_URL}) |"
              fi
              if [ -n "$SOURCE_RUN_SHA" ] && [ "$SOURCE_RUN_SHA" != "$TARGET_SHA" ]; then
                echo "| Warning | build commit \`${SOURCE_RUN_SHA}\` differs from tag commit |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
