name: Discovery conformance

# L1: run the aerospike-client-conformance fixture set through the C built-ins with
# src/test/conformance/conformance_runner.c and gate the report against c-declared.yaml.
# It needs no Aerospike server, so it is separate from pr-open.yml. The fixture set is pinned
# by commit in two places below; switch both to the v1.1.0 tag once it exists.

on:
  pull_request:
    branches: [stage]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  l1:
    name: L1 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout client
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install dependencies
        run: bash .github/script/install_deps.bash ubuntu-24.04 sync false false

      - name: Build library, aws-real probe and conformance runner
        run: |
          build() { make "$@" > build.log 2>&1 || { tail -n 100 build.log; exit 1; }; }
          build
          build aws-real-probe
          build conformance

      # Fixture set 1.1.0
      - name: Checkout conformance fixtures
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: aerospike/aerospike-client-conformance
          ref: d3b52b58da2de5dd6741a4c2a1440565b7591df7
          path: conformance

      # The collect action and the schema step pip-install into whatever python3 is on PATH, so
      # give them a Python they may modify, as Java's workflow does.
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run L1 conformance
        id: l1
        run: make conformance-run CONFORMANCE_DIR="$GITHUB_WORKSPACE/conformance"

      # The steps below also run when the runner fails, but not when an earlier step did.
      # collect-conformance-report reads only the fields its gate needs; check the full shape here.
      - name: Validate report schema
        if: ${{ !cancelled() && steps.l1.outcome != 'skipped' && hashFiles('target/conformance/conformance-report.json') != '' }}
        run: |
          python3 -m pip install jsonschema==4.26.0
          python3 - <<'EOF'
          import json, sys
          from jsonschema import Draft202012Validator
          schema = json.load(open("conformance/schema/report.schema.json"))
          report = json.load(open("target/conformance/conformance-report.json"))
          errors = list(Draft202012Validator(schema).iter_errors(report))
          for e in errors:
              print(f"::error::report {list(e.absolute_path)}: {e.message}")
          sys.exit(1 if errors else 0)
          EOF

      - name: Upload conformance report
        if: ${{ !cancelled() && steps.l1.outcome != 'skipped' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conformance-report-c
          path: |
            target/conformance/conformance-report.json
            target/conformance/conformance-fixture-server.log
          if-no-files-found: warn

      - name: Collect conformance report
        if: ${{ !cancelled() && steps.l1.outcome != 'skipped' }}
        uses: aerospike/aerospike-client-conformance/.github/actions/collect-conformance-report@d3b52b58da2de5dd6741a4c2a1440565b7591df7 # fixture set 1.1.0
        with:
          reports-directory: target/conformance
          fixtures-directory: conformance
          declarations-directory: src/test/conformance
