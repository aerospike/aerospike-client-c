            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  l3-nlb-summary:
    name: L3 rows (nlb)
    needs: l3-nlb
    if: ${{ !cancelled() && needs.l3-nlb.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
