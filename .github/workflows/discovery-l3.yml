        with:
          name: l3-kind-results-nlb-per-pod-${{ github.run_id }}-${{ github.run_attempt }}
          path: l3-kind-results
      - run: |
          {
            echo '### L3 kind rows (nlb-per-pod, AKO 4.8.0-dev1)'
            echo '```'
            if [[ -s l3-kind-results/rows.txt ]]; then
