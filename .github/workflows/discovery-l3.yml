            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  l3-tls-summary:
    name: L3 rows (tls)
    needs: l3-tls
    if: ${{ !cancelled() && needs.l3-tls.result != 'skipped' }}
    runs-on: ubuntu-24.04
