name: C Client Build & Release

permissions:
  actions: write
  id-token: write
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - stage
      - artifact-naming-fix
  workflow_dispatch:

jobs:
  build-stage:
    name: Build stage
    uses: ./.github/workflows/build-artifacts.yml
    with:
      dry-run:                  true # TODO: restore vars.DRY_RUN_RELEASE == 'true' after dev testing
      enforce-doxygen-warnings: ${{ vars.ENFORCE_DOXYGEN_WARNINGS != 'false' }} # default on
      event-lib:                libev
      run-mac:                  ${{ fromJSON(vars.PR_EXTRA_PLATFORMS || '{}').mac == true }}
      run-windows:              ${{ fromJSON(vars.PR_EXTRA_PLATFORMS || '{}').win == true }}
    secrets: inherit
